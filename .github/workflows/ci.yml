name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Tests run against synthetic sysfs fixtures, so no hardware is needed (ADR 0004).
      - run: cargo test --all

      # ADR 0010: the hardware layer takes no external dependencies. Enforce it,
      # because this is the code that will drive fans and power limits as root.
      # A malformed policy makes dbus-daemon skip the file silently, which surfaces
      # much later as AccessDenied when the daemon tries to own its name.
      - name: D-Bus policy is well-formed
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('data/org.fwhelper.Daemon1.conf')"

      # Ordering the unit after power-profiles-daemon deadlocks the boot: PPD is
      # After=multi-user.target, we are WantedBy=multi-user.target, and systemd breaks
      # the resulting cycle by silently deleting our start job. The daemon then never
      # runs and the unit still reports `enabled`. Measured on hardware 2026-09-01.
      - name: unit does not order against power-profiles-daemon
        run: |
          if grep -nE '^\s*(After|Before|Requires|Wants)=.*power-profiles-daemon' \
                 data/fw-helperd.service; then
            echo "::error::fw-helperd.service must not order against PPD - it creates a"
            echo "::error::cycle through multi-user.target and the daemon never starts."
            echo "::error::PPD is adopted at run time via NameOwnerChanged instead."
            exit 1
          fi
          echo "fw-helperd.service: no PPD ordering"

      - name: fw-helper-core has no dependencies
        run: |
          deps=$(cargo tree -p fw-helper-core --prefix none \
                 | sed 's/ v[0-9].*//' | sort -u | grep -v '^fw-helper-core$' || true)
          if [ -n "$deps" ]; then
            echo "::error::fw-helper-core gained dependencies (see ADR 0010):"
            echo "$deps"
            exit 1
          fi
          echo "fw-helper-core: clean"

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
