[workspace]
resolver = "2"
members = [
    "crates/fw-helper-core",
    "crates/fw-helper-client",
    "crates/fw-helperctl",
    "crates/fw-helperd",
    "crates/fw-helper-gui",
    "crates/fw-helper-restore-fan",
]

[workspace.package]
# Not published to crates.io: these are the pieces of one application, and
# `allow-wildcard-paths` in deny.toml depends on them being private.
publish = false
version = "0.6.3"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Wooloomooloo2/fw-helper"
rust-version = "1.85"
