[package]
name = "fw-helper-gui"
description = "Desktop UI for fw-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The user-facing binary is just `fw-helper`.
[[bin]]
name = "fw-helper"
path = "src/main.rs"

[dependencies]
# Depended on for the curve validator: the editor must reject exactly what the daemon
# rejects, and a second implementation of "valid" would drift from the first.
fw-helper-core = { path = "../fw-helper-core" }
fw-helper-client = { path = "../fw-helper-client" }
async-channel = "2"
zbus = { version = "5.13.2", default-features = false }
gtk = { version = "0.10.3", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.8", package = "libadwaita", features = ["v1_5"] }

# Temporary, for the render-chart example only.
[dev-dependencies]
cairo-rs = { version = "0.21.5", features = ["png"] }
