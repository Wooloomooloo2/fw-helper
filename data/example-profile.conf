# fw-helper user profile
#
# Copy to /etc/fw-helper/profiles.d/<something>.conf and edit. Only files ending in
# .conf are read, so editor backups are ignored. The daemon reads this directory once,
# at startup.
#
# A file whose `name` matches a built-in REPLACES it, including for the GNOME power
# slider — that is how you customise quiet, balanced or performance. A profile under
# any other name is selectable with `fw-helperctl profile <name>` but is never applied
# automatically when the slider moves: choosing between several profiles that all claim
# the same PPD profile would be a coin toss you cannot see.

# What a user types. Lowercase letters, digits and dashes.
name = silent

# The power-profiles-daemon profile to delegate to: power-saver, balanced, performance.
# fw-helper does not write platform_profile or EPP itself; PPD owns those, and fighting
# it breaks the GNOME power slider (ADR 0005).
ppd = power-saver

# Sustained CPU power limit, in watts. This does most of the thermal work: measured,
# 10 W is worth about 12 C. The usable range is 8-35 W.
#
# 35 W is measured, not advertised: the zone declares a 25 W maximum and does not enforce
# it, while above 35 W firmware quietly ignores the setpoint (a 40 W request draws 35 W).
# Anything written here is clamped when the profile is applied.
pl1_watts = 12

# Fan curve, as temperature:duty pairs. Duty is 0-255.
#
# Temperatures must ascend and duty must not fall. A duty between 1 and 30 is refused:
# measured, duty 20 leaves the fan stopped and duty 30 turns it at 1107 rpm, so anything
# between describes a stopped fan while looking like a slow one. Use 0 for stopped.
#
# This is a REQUEST. The firmware floor, the temperature ceiling and the battery guard
# are applied on top of it every tick, so a badly drawn curve cannot make the machine
# unsafe — it can only be louder than you intended.
curve = 55:0, 65:40, 75:70, 85:110, 95:255

# Optional. How much of the CPU this profile wants running: none, lpe, p-only.
#
#   none     every core online (the default, and what every profile meant before this
#            key existed)
#   lpe      park the LP-E cluster - the slowest cores, 3.3 GHz on this part - leaving
#            the 4 P-cores and 8 E-cores
#   p-only   park both Atom clusters, leaving the 4 P-cores at 4.7-4.8 GHz
#
# This is a PLACEMENT lever, not a power one. The case for it is a game that reports
# itself CPU-bound while nothing looks busy: Horizon Zero Dawn gives CPU FPS 34 against
# GPU FPS 45 while no thread exceeds 50%. That is one hot thread on a slow core, and
# parking the slow cores forces it onto a fast one.
#
# p-only is not automatically better. Anything that genuinely threads - RPCS3 emulating
# SPUs, a compile - will lose twelve cores and run slower. Benchmark before believing it.
#
# cpu0 is never parked: the kernel exposes no `online` file for the boot CPU.
#
# Parked cores are restored whenever the daemon stops, including a crash (ADR 0014).
# park_cores = lpe

# Optional. Cap the GPU's maximum clock in MHz. Omitted means the full range.
#
# UNPROVEN on this board, and deliberately not set by any shipped profile. The idea is
# to free package budget for the CPU by throttling a GPU that is not the bottleneck.
# Lowering max_freq is at least the right direction - raising min_freq to 2500 is
# already known to be honoured by the driver and ignored by the silicon - but whether
# a cap actually binds, and whether the CPU gets anything back if it does, has not been
# measured. See docs/framework_gaming_profile.md.
#
# The value is clamped to the GT's own rpn_freq..rp0_freq (100-2500 here) when applied.
# gpu_max_mhz = 1200

# Optional. Omit it and the profile leaves the charge limit alone, which is what the
# three built-ins do: battery longevity is a standing preference, not a performance
# choice, and switching profiles should not undo it.
# charge_limit = 80
