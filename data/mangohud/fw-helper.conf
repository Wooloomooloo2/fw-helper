### fw-helper + MangoHud
###
### On GNOME/Wayland no ordinary window can be drawn above a fullscreen game: Mutter
### implements no protocol for it. MangoHud is not a window - the Vulkan loader loads it
### into the game's own process and it paints into the frame before presentation, so the
### compositor never learns an overlay exists. That is why it works where fw-helper's own
### overlay window cannot, and why fw-helper feeds it rather than competing with it.
###
### Use it:
###
###   MANGOHUD=1 MANGOHUD_CONFIGFILE=/usr/share/fw-helper/mangohud/fw-helper.conf %command%
###
### as Steam launch options, or copy the two fw-helper lines at the bottom into your own
### ~/.config/MangoHud/MangoHud.conf.

### What MangoHud already does better than anything shelling out could.
fps
frametime
cpu_stats
cpu_temp
cpu_mhz
gpu_temp
ram
throttling_status

### gpu_stats is deliberately NOT enabled, because on this machine it does not work.
### Measured with MangoHud 0.6.9.1 on 2026-09-04: its Intel support is i915-only and
### this board runs the `xe` driver, so it logs
###
###   No device filter specified and no discrete/integrated i915 devices found
###   Missing permissions for 'intel_gpu_top'
###   Disabling gpu_stats
###
### It then falls back to intel_gpu_top, which needs perf_event_open and is blocked by
### kernel.perf_event_paranoid=4. So the GPU figure below comes from fw-helper instead,
### which reads the per-engine counters out of /proc/<pid>/fdinfo and needs no
### permission at all. Turn gpu_stats back on if you are on i915 or a discrete card.

### What MangoHud has no way to know.
###
### GPU load (see above), the sustained power limit being enforced, who owns the fan, the
### active profile, the battery pack temperature, and whether a session is being
### recorded. The pack matters and nothing else reports it: it is the one component with
### a low limit (49.9 C) and no protection of its own, while the CPU looks after itself
### at Tjmax.
###
### `exec` runs on every HUD refresh, INSIDE the game's frame loop, so it has to be
### trivial. fw-helperd writes this file once a second and this only reads it - anything
### that opened a D-Bus connection per frame would be a frame-time bug.
custom_text=fw-helper
exec=cat /run/fw-helper/hud
