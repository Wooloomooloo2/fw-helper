# cargo-deny — supply-chain checks for a root-privileged daemon (ADR 0010).

[advisories]
version = 2
yanked = "deny"
# zbus 6 merged zvariant, zbus_names and zvariant_derive into itself, and RustSec then
# marked the standalone crates unmaintained (2026-11). They are what zbus 5 is built
# from, so the only fix is the zbus 6 migration - a breaking change to the daemon's and
# the client's D-Bus code, to be done as its own piece of work. Ignored with the user's
# agreement, 2026-11-17. These are "unmaintained" notices, not vulnerabilities; a
# security advisory against any of these crates still fails the check.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; migration pending" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; migration pending" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; migration pending" },
]

[licenses]
version = 2
# The workspace is GPL-3.0-only; these are what its dependency tree pulls in.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # The workspace's own crates declare GPL-3.0-only, which is a different SPDX
    # identifier from the deprecated "GPL-3.0" - so allowing only the latter rejected
    # every crate in this repository. That is what failed `cargo deny check licenses`
    # in CI from the day the check was added.
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `wildcards = "deny"` also catches this workspace's own path dependencies, which carry
# no version requirement because they are never published - `fw-helper-core = { path =
# "../fw-helper-core" }` and its four siblings. The check is aimed at wildcards on
# *registry* crates, where the next release can change under you; this exempts the
# private ones and leaves that intact.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
